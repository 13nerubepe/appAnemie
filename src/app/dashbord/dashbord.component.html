<ion-header>
  <ion-toolbar class="custom-toolbar">
    <div class="toolbar-inner">
      <div class="toolbar-logo"><ion-icon name="heart-outline"></ion-icon></div>
      <div>
        <div class="toolbar-title">IMAS AI</div>
        <div class="toolbar-sub">Anémie · Enfants &lt; 5 ans</div>
      </div>
    </div>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="logout()">
        <ion-icon name="log-out-outline" slot="icon-only" style="color:white"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-content">

    <div class="banner primary">
      <div class="bub b1"></div><div class="bub b2"></div>
      <p class="b-sub">Tableau de bord</p>
      <h2 class="b-title">Détection de l'anémie</h2>
      <p class="b-desc">EDS Cameroun 2018 · Random Forest · Régression Ordinale</p>
    </div>

    <div class="stats-row">
      <div class="stat"><span class="sn">{{ stats.total }}</span><span class="sl">Analyses</span></div>
      <div class="stat d"><span class="sn">{{ stats.anemie }}</span><span class="sl">Anémie</span></div>
      <div class="stat s"><span class="sn">{{ stats.normal }}</span><span class="sl">Normal</span></div>
    </div>

    <p class="section-lbl">Actions rapides</p>

    <div class="action-card" *ngFor="let a of actions" (click)="go(a.path)">
      <div class="a-icon" [ngClass]="a.cls">
        <ion-icon [name]="a.icon"></ion-icon>
      </div>
      <div class="a-text">
        <strong>{{ a.label }}</strong>
        <p>{{ a.desc }}</p>
      </div>
      <ion-icon name="chevron-forward-outline" class="a-arrow"></ion-icon>
    </div>

  </div>
</ion-content>
