<ion-header>
  <ion-toolbar class="custom-toolbar">
    <div class="toolbar-inner">
      <div class="toolbar-logo"><ion-icon name="bar-chart-outline"></ion-icon></div>
      <div>
        <div class="toolbar-title">Graphiques</div>
        <div class="toolbar-sub">Analyse des facteurs</div>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="graph-content">

    <!-- Cas par mois -->
    <div class="chart-card">
      <div class="chart-title">
        <ion-icon name="calendar-outline"></ion-icon>
        Cas détectés par mois
      </div>
      <div class="bar-chart">
        <div class="bar-col" *ngFor="let m of monthlyData">
          <div class="bar-val">{{ m.val }}</div>
          <div class="bar" [style.height.px]="m.height"
               [style.background]="m.color"></div>
          <div class="bar-lbl">{{ m.label }}</div>
        </div>
      </div>
    </div>

    <!-- Répartition -->
    <div class="chart-card">
      <div class="chart-title">
        <ion-icon name="pie-chart-outline"></ion-icon>
        Répartition des résultats
      </div>
      <div class="donut-row">
        <div class="legend-list">
          <div class="leg-item" *ngFor="let r of repartition">
            <div class="leg-dot" [style.background]="r.color"></div>
            <span class="leg-name">{{ r.label }}</span>
            <span class="leg-val">{{ r.pct }}%</span>
          </div>
        </div>
        <div class="ring-wrap">
          <svg viewBox="0 0 36 36" class="donut-svg">
            <circle cx="18" cy="18" r="15.9" fill="none" stroke="#e8f0f6" stroke-width="3.5"/>
            <circle cx="18" cy="18" r="15.9" fill="none" stroke="#e05a5a" stroke-width="3.5"
                    stroke-dasharray="35 65" stroke-dashoffset="-0"/>
            <circle cx="18" cy="18" r="15.9" fill="none" stroke="#f0a060" stroke-width="3.5"
                    stroke-dasharray="20 80" stroke-dashoffset="-35"/>
            <circle cx="18" cy="18" r="15.9" fill="none" stroke="#4aaa82" stroke-width="3.5"
                    stroke-dasharray="45 55" stroke-dashoffset="-55"/>
          </svg>
          <div class="ring-center">
            <span class="ring-num">248</span>
            <span class="ring-lbl">Total</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Sexe et âge -->
    <div class="chart-card">
      <div class="chart-title">
        <ion-icon name="people-outline"></ion-icon>
        Répartition par sexe
      </div>
      <div class="gender-row">
        <div class="gender-card blue">
          <ion-icon name="male-outline"></ion-icon>
          <span class="g-num">128</span>
          <span class="g-lbl">Garçons</span>
          <div class="g-bar"><div class="g-fill" style="width:52%"></div></div>
        </div>
        <div class="gender-card violet">
          <ion-icon name="female-outline"></ion-icon>
          <span class="g-num">120</span>
          <span class="g-lbl">Filles</span>
          <div class="g-bar"><div class="g-fill violet-fill" style="width:48%"></div></div>
        </div>
      </div>
    </div>

    <!-- Tranches d'âge -->
    <div class="chart-card">
      <div class="chart-title">
        <ion-icon name="analytics-outline"></ion-icon>
        Prévalence par tranche d'âge
      </div>
      <div class="progress-list">
        <div class="prog-item" *ngFor="let t of tranches">
          <div class="prog-label">{{ t.label }}</div>
          <div class="prog-track">
            <div class="prog-fill" [style.width.%]="t.pct"></div>
          </div>
          <div class="prog-val">{{ t.pct }}%</div>
        </div>
      </div>
    </div>

  </div>
</ion-content>
