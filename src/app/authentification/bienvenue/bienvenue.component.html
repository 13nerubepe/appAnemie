<ion-content [fullscreen]="true">
  <div class="login-wrap">

    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>

    <div class="hero">
      <div class="logo-ring">
        <ion-icon name="heart-outline" class="logo-icon"></ion-icon>
      </div>
      <h1 class="app-title">IMAS AI</h1>
      <p class="app-sub">Détection de l'anémie · Cameroun</p>
    </div>

    <div class="card">
      <h2 class="card-title">Bienvenue</h2>
      <p class="card-desc">
        Système intelligent de détection de l'anémie chez les enfants de moins de 5 ans.
      </p>

      <ion-button
        expand="block"
        shape="round"
        class="login-btn"
        (click)="continuer()">
        Commencer
        <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
      </ion-button>

      <div class="secure-badge">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
        <span>Données protégées · Usage médical</span>
      </div>
    </div>

    <p class="version">v1.0.0 · IMAS AI Cameroun</p>

  </div>
</ion-content>
