<ion-header>
  <ion-toolbar class="custom-toolbar">
    <div class="toolbar-inner">
      <div class="toolbar-logo"><ion-icon name="time-outline"></ion-icon></div>
      <div>
        <div class="toolbar-title">Historique</div>
        <div class="toolbar-sub">{{ patients.length }} analyses enregistrées</div>
      </div>
    </div>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="exportData()">
        <ion-icon name="download-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="hist-content">

    <!-- Recherche -->
    <div class="search-bar">
      <ion-icon name="search-outline"></ion-icon>
      <ion-input [(ngModel)]="searchText" placeholder="Rechercher un patient..."
                 (ionInput)="onSearch()">
      </ion-input>
    </div>

    <!-- Filtres -->
    <div class="filter-chips">
      <div class="chip" [class.active]="activeFilter === 'tous'"
           (click)="setFilter('tous')">Tous</div>
      <div class="chip" [class.active]="activeFilter === 'anemie'"
           (click)="setFilter('anemie')">Anémie</div>
      <div class="chip" [class.active]="activeFilter === 'normal'"
           (click)="setFilter('normal')">Normal</div>
      <div class="chip" [class.active]="activeFilter === 'modere'"
           (click)="setFilter('modere')">Modéré</div>
      <div class="chip" [class.active]="activeFilter === 'mois'"
           (click)="setFilter('mois')">Ce mois</div>
    </div>

    <!-- Liste -->
    <div class="hist-list">
      <div class="hist-card" *ngFor="let p of filteredPatients"
           (click)="voirDetail(p)">
        <div class="avatar" [ngClass]="getAvatarClass(p.resultat)">
          {{ getInitials(p.prenom, p.nom) }}
        </div>
        <div class="hist-info">
          <div class="hist-name">{{ p.prenom }} {{ p.nom }}</div>
          <div class="hist-meta">
            {{ p.age }} mois · {{ p.sexe }} · {{ p.date | date:'d MMM yyyy' }}
          </div>
          <div class="hist-meta">
            <ion-icon name="location-outline"></ion-icon> {{ p.region }}
          </div>
        </div>
        <div class="hist-right">
          <span class="badge-result" [ngClass]="getBadgeClass(p.resultat)">
            {{ p.resultat }}
          </span>
          <div class="conf-score">{{ p.confiance }}%</div>
        </div>
      </div>
    </div>

    <div class="empty-state" *ngIf="filteredPatients.length === 0">
      <ion-icon name="search-outline"></ion-icon>
      <p>Aucun résultat trouvé</p>
    </div>

  </div>
</ion-content>
