<ion-header>
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard" text=""></ion-back-button>
    </ion-buttons>

    <div class="toolbar-inner">
      <div class="toolbar-logo"><ion-icon name="time-outline"></ion-icon></div>
      <div>
        <div class="toolbar-title">Historique</div>
        <div class="toolbar-sub">{{ tous.length }} analyses enregistrées</div>
      </div>
    </div>

    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="exporter()">
        <ion-icon name="download-outline" slot="icon-only" style="color:white"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-content">

    <div class="search-wrap">
      <ion-icon name="search-outline"></ion-icon>
      <ion-input [(ngModel)]="searchText" placeholder="Rechercher un diagnostic..."
                 (ionInput)="onSearch()">
      </ion-input>
    </div>

    <div class="chips">
      <div class="chip" [class.active]="activeFilter==='tous'"   (click)="setFilter('tous')">Tous</div>
      <div class="chip" [class.active]="activeFilter==='normal'" (click)="setFilter('normal')">Normal</div>
      <div class="chip" [class.active]="activeFilter==='anemie'" (click)="setFilter('anemie')">Anémie</div>
      <div class="chip" [class.active]="activeFilter==='severe'" (click)="setFilter('severe')">Mod./Sév.</div>
      <div class="chip" [class.active]="activeFilter==='mois'"   (click)="setFilter('mois')">Ce mois</div>
    </div>

    <div class="empty-state" *ngIf="chargement">
      <p>Chargement...</p>
    </div>

    <div class="hist-card" *ngFor="let h of filtres" (click)="voirDetail(h)">
      <div class="avatar" [ngClass]="getCls(h)">{{ getInitiales(h) }}</div>

      <div class="hist-info">
        <div class="hist-name">{{ h.nom_praticien || 'Praticien inconnu' }}</div>
        <div class="hist-meta">{{ h.created_at | date:'d MMM yyyy · HH:mm' }}</div>
      </div>

      <div class="hist-right">
        <span class="badge" [ngClass]="getBadgeCls(h)">{{ getLabel(h) }}</span>
        <div class="conf">{{ h.diagnostic_final }}</div>
        <ion-icon name="trash-outline" class="trash"
                  (click)="supprimer(h, $event)"></ion-icon>
      </div>
    </div>

    <div class="empty-state" *ngIf="filtres.length === 0 && !chargement">
      <ion-icon name="person-outline"></ion-icon>
      <p>Aucune analyse trouvée</p>
    </div>

  </div>
</ion-content>
